services:
  searxng:
    image: searxng/searxng:latest
    container_name: babiespicks-searxng
    ports:
      - "4000:8080"
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:4000/
      - SEARXNG_SECRET=dev-secret-key-change-in-prod
      - SEARXNG_SERVER_LIMITER=false
      - SEARXNG_SEARCH_DEFAULT_LANG=en
      - SEARXNG_SEARCH_SAFE_SEARCH=0
      - SEARXNG_UI_DEFAULT_THEME=simple
    restart: unless-stopped
    networks:
      - babiespicks

networks:
  babiespicks:
    name: babiespicks
    driver: bridge